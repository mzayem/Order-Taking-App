plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("key.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.example.dmc"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Final id. The Kotlin namespace above stays com.example.dmc (internal only).
        applicationId = "com.techstersol.softifex"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
                storeFile = rootProject.file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Signed with the release key from android/key.properties; without
            // that file it falls back to the debug key (local test builds only).
            signingConfig = keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug

            // R8 / resource shrinking strip things plugins look up by name
            // (notification icon, SQLite, reflection) and made the release
            // app hang before the splash. The size saving is not worth it.
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Replaces android { kotlinOptions { } }, which Kotlin 2.2 rejects. Same 1.8 target as compileOptions.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
